<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>그림 전화 게임</title>
<style>
  :root{
    --navy:#1F2A5C; --coral:#F4645F; --gold:#F7C948;
    --ink:#1A1A1A; --gray:#6B7280; --line:#E3E6EE;
    --bg:#F4F5F8; --white:#FFFFFF; --blue:#1F6FB2;
    --ok:#2E9E5B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:16px; user-select:none;
  }
  .wrap{width:100%; max-width:520px;}
  header{
    background:var(--navy); color:#fff; border-radius:18px;
    padding:18px 22px; margin-bottom:16px;
  }
  header .eyebrow{font-size:12px; font-weight:700; letter-spacing:2px; color:var(--gold);}
  header h1{margin:6px 0 0; font-size:24px; font-weight:800;}
  header .room{margin-top:8px; font-size:13px; color:#C9CEE0;}
  .card{
    background:var(--white); border-radius:18px; padding:22px;
    box-shadow:0 2px 14px rgba(31,42,92,.06); margin-bottom:16px;
  }
  label{display:block; font-size:14px; font-weight:700; color:var(--gray); margin-bottom:8px;}
  input[type=text]{
    width:100%; font-size:20px; padding:14px 16px; border:2px solid var(--line);
    border-radius:12px; font-family:inherit; margin-bottom:16px;
  }
  input:focus{outline:none; border-color:var(--blue);}
  .btn{
    display:block; width:100%; border:none; border-radius:14px;
    font-family:inherit; font-size:19px; font-weight:800; padding:16px;
    cursor:pointer; transition:transform .06s, opacity .2s; color:#fff;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-navy{background:var(--navy);}
  .btn-coral{background:var(--coral);}
  .btn-gold{background:var(--gold); color:var(--ink);}
  .btn-ghost{background:#EDEFF5; color:var(--navy);}
  .roles{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:6px;}
  .role{
    aspect-ratio:1/1.15; border:2px solid var(--line); border-radius:14px;
    background:#fff; display:flex; flex-direction:column; align-items:center;
    justify-content:center; cursor:pointer; padding:4px;
  }
  .role:active{transform:scale(.96);}
  .role .n{font-size:26px; font-weight:800; color:var(--navy);}
  .role .t{font-size:11px; color:var(--gray); margin-top:2px; text-align:center; line-height:1.2;}
  .role.draw .n{color:var(--coral);}
  .badge{
    display:inline-block; background:var(--gold); color:var(--ink);
    font-size:13px; font-weight:800; padding:5px 12px; border-radius:20px; margin-bottom:14px;
  }
  .badge.draw{background:var(--coral); color:#fff;}
  .prompt-box{
    background:#FFF8E6; border:2px dashed var(--gold); border-radius:14px;
    padding:20px; text-align:center; margin-bottom:16px;
  }
  .prompt-box .lbl{font-size:13px; color:#8A6D00; font-weight:700; margin-bottom:8px;}
  .prompt-box .val{font-size:26px; font-weight:800; color:var(--ink);}
  .seen-box{
    background:#F0F4FA; border:2px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:16px; text-align:center;
  }
  .seen-box .lbl{font-size:13px; color:var(--blue); font-weight:700; margin-bottom:10px;}
  .seen-word{font-size:28px; font-weight:800; color:var(--ink);}
  canvas{
    width:100%; aspect-ratio:1/1; background:#fff; border:2px solid var(--line);
    border-radius:14px; touch-action:none; display:block;
  }
  .tools{display:flex; gap:8px; margin:10px 0 16px;}
  .tools button{
    flex:1; border:2px solid var(--line); background:#fff; border-radius:10px;
    padding:10px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  }
  .tools button.active{border-color:var(--navy); background:var(--navy); color:#fff;}
  .hint{font-size:13px; color:var(--gray); line-height:1.6; margin-top:4px;}
  .status{
    text-align:center; padding:30px 20px; color:var(--gray); font-size:16px; line-height:1.7;
  }
  .status .spin{
    width:38px; height:38px; border:4px solid var(--line); border-top-color:var(--coral);
    border-radius:50%; margin:0 auto 16px; animation:sp 1s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  .result-img{width:100%; border:2px solid var(--line); border-radius:14px; margin-bottom:14px;}
  .result-row{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
  .result-row .k{font-size:13px; font-weight:700; color:var(--gray); min-width:74px;}
  .result-row .v{font-size:18px; font-weight:700;}
  .err{background:#FDECEC; color:#8C2F2C; border-radius:12px; padding:12px 16px; font-size:14px; margin-bottom:14px; line-height:1.5;}
  .center{text-align:center;}
  .mt{margin-top:14px;}
  .small{font-size:13px; color:var(--gray); text-align:center; margin-top:10px;}
  .flow{display:flex; justify-content:center; gap:5px; margin:4px 0 2px; flex-wrap:wrap;}
  .flow span{font-size:11px; color:var(--gray);}
  .flow b{color:var(--navy);}

  .timer{
    display:flex; align-items:center; justify-content:center; gap:12px;
    background:#fff; border:2px solid var(--line); border-radius:14px;
    padding:12px 16px; margin-bottom:14px;
  }
  .timer .ring{position:relative; width:56px; height:56px; flex:none;}
  .timer .ring svg{transform:rotate(-90deg);}
  .timer .ring .num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:var(--ink);
  }
  .timer .lbl{font-size:15px; font-weight:700; color:var(--gray);}
  .timer.warn{border-color:var(--coral);}
  .timer.warn .lbl{color:var(--coral);}
  .timer.warn .ring .num{color:var(--coral);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">2학기 정보 · 첫 시간</div>
    <h1>그림 전화 게임</h1>
    <div class="room" id="roomInfo">모둠 번호를 선택해 시작하세요</div>
  </header>
  <div id="app"></div>
</div>

<script>
/* ======================================================================
   설정 : 아래 APPS_SCRIPT_URL 을 본인의 웹 앱 URL 로 바꾸세요.
   (설치안내서 참고)
====================================================================== */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMxTKA5ZOaQVZMJfU2c4FkFT-BJw-OF_Iaeb7EudkljqgvCZe0C28QNxjruyQEltGwXA/exec";

/* 게임 흐름 정의
   1: (선생님이 제시한 주제) → 그림
   2: 1번 그림 → 단어
   3: 2번 단어 → 그림
   4: 3번 그림 → 단어
   5: 3번 그림 → 단어   (4번과 5번이 같은 그림을 봄)
   제시어(주제)는 프로그램이 주지 않고, 교사가 칠판·카드로 직접 제시한다. */
const ROLES = {
  1:{type:'draw',  sees:'topic', label:'주제 → 그림'},
  2:{type:'word',  sees:1,       label:'1번 그림 → 단어'},
  3:{type:'draw',  sees:2,       label:'2번 단어 → 그림'},
  4:{type:'word',  sees:3,       label:'3번 그림 → 단어'},
  5:{type:'word',  sees:3,       label:'3번 그림 → 단어'},
};

/* 제한 시간(초) : 그림 30초, 단어 15초 */
const TIME_DRAW = 30, TIME_WORD = 15;
let timerHandle = null;

const app = document.getElementById('app');
const roomInfo = document.getElementById('roomInfo');
let state = { team:null, role:null };
let pollTimer = null;

/* -------------------- 서버 통신 -------------------- */
async function api(action, payload={}){
  const res = await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    body: JSON.stringify({action, ...payload}),
  });
  if(!res.ok) throw new Error('네트워크 오류 ('+res.status+') — 배포 권한이 \'모든 사용자\'인지 확인하세요.');
  let data;
  try{ data = await res.json(); }
  catch(pe){ throw new Error('서버 응답을 읽지 못했어요. 재배포(새 버전)를 했는지 확인하세요.'); }
  if(data.error) throw new Error('서버: ' + data.error);
  return data;
}

/* -------------------- 화면 : 시작 -------------------- */
function screenStart(){
  stopPoll();
  stopTimer();
  state = {team:null, role:null};
  roomInfo.textContent = '모둠 번호를 선택해 시작하세요';
  app.innerHTML = `
    <div class="card">
      <label for="teamInput">우리 모둠 번호</label>
      <input type="text" id="teamInput" inputmode="numeric" placeholder="예: 3" autocomplete="off">
      <button class="btn btn-navy" id="goRole">다음</button>
      <p class="small">같은 모둠 친구들과 번호를 똑같이 입력하세요.</p>
    </div>`;
  document.getElementById('goRole').onclick = ()=>{
    const t = document.getElementById('teamInput').value.trim();
    if(!t){ shake('teamInput'); return; }
    state.team = t;
    screenRole();
  };
}

/* -------------------- 화면 : 번호 선택 -------------------- */
function screenRole(){
  roomInfo.textContent = `${state.team}모둠`;
  let cells = '';
  for(let i=1;i<=5;i++){
    const r = ROLES[i];
    cells += `<div class="role ${r.type==='draw'?'draw':''}" data-role="${i}">
      <div class="n">${i}</div><div class="t">${r.type==='draw'?'그림':'단어'}</div></div>`;
  }
  app.innerHTML = `
    <div class="card">
      <label>내 번호를 선택하세요</label>
      <div class="roles">${cells}</div>
      <div class="flow mt">
        <span><b>1</b> 그림</span><span>→</span><span><b>2</b> 단어</span><span>→</span>
        <span><b>3</b> 그림</span><span>→</span><span><b>4</b> 단어</span><span>·</span><span><b>5</b> 단어</span>
      </div>
      <p class="small">4번과 5번은 모두 3번이 그린 그림을 봅니다.</p>
      <p class="small">그림은 30초, 단어는 15초 안에 완성해요.</p>
      <button class="btn btn-ghost mt" id="back">← 모둠 다시 선택</button>
    </div>`;
  document.querySelectorAll('.role').forEach(el=>{
    el.onclick = ()=>{ state.role = Number(el.dataset.role); routeRole(); };
  });
  document.getElementById('back').onclick = screenStart;
}

/* 번호별 화면 분기 */
function routeRole(){
  if(state.role === 1) screenTopicDraw();
  else screenWaitPrev();
}

/* -------------------- 1번 : 선생님이 제시한 주제 → 그림 -------------------- */
function screenTopicDraw(){
  stopTimer();
  roomInfo.textContent = `${state.team}모둠 · 1번`;
  app.innerHTML = `
    <div class="card">
      <span class="badge draw">1번 · 그림 그리기</span>
      <div class="prompt-box">
        <div class="lbl">칠판(또는 카드)에 있는 주제를 그리세요</div>
        <div class="val">주제를 확인했나요?</div>
      </div>
      <button class="btn btn-coral" id="start">준비됐어요 · 30초 시작</button>
      <p class="hint">시작을 누르면 30초 타이머가 돌아갑니다. 시간이 끝나면 자동으로 제출돼요.</p>
    </div>`;
  document.getElementById('start').onclick = ()=>{
    app.innerHTML = `
      <div class="card">
        <span class="badge draw">1번 · 그림 그리기</span>
        ${timerBlock(TIME_DRAW)}
        ${canvasBlock()}
        <button class="btn btn-coral mt" id="submit">다 그렸어요 → 제출</button>
        <p class="hint">제출하면 2번 친구가 이 그림을 봅니다.</p>
      </div>`;
    initCanvas();
    const auto = ()=>{ stopTimer(); submitStep('draw', {image:getCanvasData()}); };
    document.getElementById('submit').onclick = ()=>{
      if(isCanvasEmpty()){ alert('그림을 먼저 그려 주세요.'); return; }
      auto();
    };
    startTimer(TIME_DRAW, auto);   // 시간 종료 시엔 빈 그림이라도 자동 제출
  };
}

/* -------------------- 2·3·4·5번 : 앞 번호 기다리기 -------------------- */
function screenWaitPrev(){
  stopTimer();
  stopPoll();
  const r = ROLES[state.role];
  const seesNum = r.sees;
  const seesKind = ROLES[seesNum].type==='draw' ? '그림' : '단어';
  roomInfo.textContent = `${state.team}모둠 · ${state.role}번`;
  app.innerHTML = `
    <div class="card center">
      <div style="font-size:40px; margin-bottom:6px;">⏳</div>
      <h2 style="margin:0 0 8px; font-size:21px;">${state.role}번 차례를 기다려요</h2>
      <p class="hint">앞의 <b>${seesNum}번</b> 친구가 ${seesKind}을 다 만들면,<br>아래 <b>확인하기</b> 버튼을 눌러 불러오세요.</p>
      <button class="btn btn-navy mt" id="check">${seesNum}번 친구 ${seesKind} 확인하기</button>
      <button class="btn btn-ghost mt" id="back">← 번호 다시 선택</button>
    </div>`;
  document.getElementById('back').onclick = screenRole;
  document.getElementById('check').onclick = async ()=>{
    const btn = document.getElementById('check');
    btn.disabled = true; btn.textContent = '불러오는 중…';
    try{
      const st = await api('getStatus', {team:state.team, step:seesNum});
      if(!st.ready){
        // 아직 앞사람이 제출 안 함
        app.querySelector('.hint').innerHTML =
          `아직 <b>${seesNum}번</b> 친구가 ${seesKind}을 제출하지 않았어요.<br>조금 기다렸다가 다시 눌러 주세요.`;
        btn.disabled = false; btn.textContent = `${seesNum}번 친구 ${seesKind} 다시 확인하기`;
        return;
      }
      const r2 = await api('getData', {team:state.team, step:seesNum});
      if(!r2.ready){
        btn.disabled = false; btn.textContent = `다시 확인하기`;
        return;
      }
      if(ROLES[state.role].type==='word') screenWriteWord(r2);
      else screenDrawFromWord(r2);
    }catch(e){
      btn.disabled = false; btn.textContent = `다시 확인하기`;
      app.querySelector('.hint').innerHTML = '불러오기 오류: ' + escapeHtml(String(e && e.message || e)) + '<br>잠시 후 다시 눌러 주세요.';
    }
  };
}

/* -------------------- 단어 쓰기 (2·4·5번) -------------------- */
function screenWriteWord(prev){
  stopTimer();
  const r = ROLES[state.role];
  roomInfo.textContent = `${state.team}모둠 · ${state.role}번`;
  app.innerHTML = `
    <div class="card">
      <span class="badge">${state.role}번 · 단어 쓰기</span>
      <div class="seen-box">
        <div class="lbl">${r.sees}번 친구가 그린 그림</div>
        <img class="result-img" src="${prev.image}" alt="앞 사람 그림" style="margin-bottom:0;">
      </div>
      ${timerBlock(TIME_WORD)}
      <label for="wordInput">이 그림은 무엇일까요? 한 단어로</label>
      <input type="text" id="wordInput" placeholder="예: 수박 먹기" autocomplete="off">
      <button class="btn btn-navy" id="submit">제출</button>
      <p class="hint">${state.role===5||state.role===4 ? '4번과 5번은 같은 그림을 보고 각자 단어를 씁니다.' : '제출하면 다음 친구에게 넘어갑니다.'}</p>
    </div>`;
  const done = ()=>{
    stopTimer();
    let w = document.getElementById('wordInput').value.trim();
    if(!w) w = '(시간 초과)';   // 시간이 끝났는데 못 썼으면 자동 표시
    submitStep('word', {word:w});
  };
  document.getElementById('submit').onclick = ()=>{
    const w = document.getElementById('wordInput').value.trim();
    if(!w){ shake('wordInput'); return; }
    done();
  };
  startTimer(TIME_WORD, done);
}

/* -------------------- 단어 보고 그림 그리기 (3번) -------------------- */
function screenDrawFromWord(prev){
  stopTimer();
  roomInfo.textContent = `${state.team}모둠 · 3번`;
  // 먼저 단어를 확인시키고, 시작을 누르면 타이머 그리기 화면으로
  app.innerHTML = `
    <div class="card">
      <span class="badge draw">3번 · 그림 그리기</span>
      <div class="seen-box">
        <div class="lbl">2번 친구가 쓴 단어</div>
        <div class="seen-word">${escapeHtml(prev.word)}</div>
      </div>
      <button class="btn btn-coral" id="start">준비됐어요 · 30초 시작</button>
      <p class="hint">시작을 누르면 30초 타이머가 돌아갑니다. 시간이 끝나면 자동 제출돼요.</p>
    </div>`;
  document.getElementById('start').onclick = ()=>{
    app.innerHTML = `
      <div class="card">
        <span class="badge draw">3번 · 그림 그리기</span>
        <div class="seen-box">
          <div class="lbl">2번 친구가 쓴 단어</div>
          <div class="seen-word">${escapeHtml(prev.word)}</div>
        </div>
        ${timerBlock(TIME_DRAW)}
        ${canvasBlock()}
        <button class="btn btn-coral mt" id="submit">다 그렸어요 → 제출</button>
        <p class="hint">이 그림은 4번과 5번 친구가 함께 봅니다.</p>
      </div>`;
    initCanvas();
    const auto = ()=>{ stopTimer(); submitStep('draw', {image:getCanvasData()}); };
    document.getElementById('submit').onclick = ()=>{
      if(isCanvasEmpty()){ alert('그림을 먼저 그려 주세요.'); return; }
      auto();
    };
    startTimer(TIME_DRAW, auto);
  };
}

/* -------------------- 제출 공통 -------------------- */
let submitting=false;
async function submitStep(kind, data){
  if(submitting) return;      // 중복 전송 방지
  submitting=true;
  stopTimer();
  app.innerHTML = `<div class="card"><div class="status"><div class="spin"></div>제출하는 중…</div></div>`;
  try{
    await api('submitStep', {team:state.team, step:state.role, kind, ...data});
    submitting=false;
    screenDone();
  }catch(e){
    submitting=false;
    showError('제출이 지연되고 있어요. 잠시 후 다시 눌러 주세요.', ()=>submitStep(kind, data));
  }
}

/* -------------------- 제출 완료 -------------------- */
function screenDone(){
  stopTimer();
  roomInfo.textContent = `${state.team}모둠 · ${state.role}번 · 완료`;
  const isLast = (state.role===4 || state.role===5);
  app.innerHTML = `
    <div class="card center">
      <div style="font-size:44px; margin-bottom:8px;">✓</div>
      <h2 style="margin:0 0 6px; font-size:22px; color:var(--ok);">제출 완료!</h2>
      <p class="hint">${state.role}번 역할을 마쳤어요.</p>
      <button class="btn btn-navy mt" id="result">우리 모둠 결과 보기</button>
      <button class="btn btn-ghost mt" id="restart">처음으로</button>
    </div>`;
  document.getElementById('result').onclick = screenResult;
  document.getElementById('restart').onclick = screenStart;
}

/* -------------------- 결과 화면 -------------------- */
async function screenResult(){
  roomInfo.textContent = `${state.team}모둠 · 결과`;
  app.innerHTML = `<div class="card"><div class="status"><div class="spin"></div>결과를 불러오는 중…</div></div>`;
  let d;
  try{ d = await api('getResult', {team:state.team}); }
  catch(e){ return showError(e.message, screenResult); }

  const step3 = d.steps && d.steps['3'];
  const w2 = d.steps && d.steps['2'] ? d.steps['2'].word : '(아직)';
  const w4 = d.steps && d.steps['4'] ? d.steps['4'].word : '(아직)';
  const w5 = d.steps && d.steps['5'] ? d.steps['5'].word : '(아직)';
  const img1 = d.steps && d.steps['1'] ? d.steps['1'].image : null;

  app.innerHTML = `
    <div class="card">
      <span class="badge">${state.team}모둠 결과</span>
      <div class="result-row"><span class="k">처음 제시어</span><span class="v" style="color:var(--coral);">${escapeHtml(d.prompt||'(없음)')}</span></div>
      ${img1?`<div class="mt"><div class="result-row" style="border:none;"><span class="k">1번 그림</span></div><img class="result-img" src="${img1}"></div>`:''}
      <div class="result-row"><span class="k">2번 단어</span><span class="v">${escapeHtml(w2)}</span></div>
      ${step3?`<div class="mt"><div class="result-row" style="border:none;"><span class="k">3번 그림</span></div><img class="result-img" src="${step3.image}"></div>`:''}
      <div class="result-row"><span class="k">4번 단어</span><span class="v">${escapeHtml(w4)}</span></div>
      <div class="result-row"><span class="k">5번 단어</span><span class="v">${escapeHtml(w5)}</span></div>
      <div class="prompt-box mt" style="background:#F0F4FA; border-color:var(--line); border-style:solid;">
        <div class="lbl" style="color:var(--blue);">같은 3번 그림을 보고</div>
        <div class="val" style="font-size:20px;">4번 "${escapeHtml(w4)}"  vs  5번 "${escapeHtml(w5)}"</div>
      </div>
      <p class="hint center">한 그림을 두 사람이 어떻게 다르게 봤나요?</p>
      <button class="btn btn-gold mt" id="refresh">새로고침</button>
      <button class="btn btn-ghost mt" id="reset">이 모둠 새 게임 시작</button>
      <button class="btn btn-ghost mt" id="home">처음으로</button>
    </div>`;
  document.getElementById('refresh').onclick = screenResult;
  document.getElementById('home').onclick = screenStart;
  document.getElementById('reset').onclick = async ()=>{
    if(!confirm(`${state.team}모둠의 그림과 단어를 모두 지우고 새 게임을 시작할까요?`)) return;
    try{ await api('resetTeam', {team:state.team}); alert('새 게임을 시작할 수 있어요. 1번부터 다시 시작하세요.'); screenStart(); }
    catch(e){ alert(e.message); }
  };
}


/* ==================== 타이머 ==================== */
function timerBlock(sec){
  return `
    <div class="timer" id="timerWrap">
      <div class="ring">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" fill="none" stroke="#E3E6EE" stroke-width="6"></circle>
          <circle id="timerArc" cx="28" cy="28" r="24" fill="none" stroke="#F4645F" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="0"></circle>
        </svg>
        <div class="num" id="timerNum">${sec}</div>
      </div>
      <div class="lbl" id="timerLbl">남은 시간</div>
    </div>`;
}
function startTimer(sec, onEnd){
  stopTimer();
  const total = sec;
  let left = sec;
  const arc = document.getElementById('timerArc');
  const num = document.getElementById('timerNum');
  const wrap = document.getElementById('timerWrap');
  const lbl = document.getElementById('timerLbl');
  const C = 150.8; // 2*pi*24
  const paint = ()=>{
    if(num) num.textContent = left;
    if(arc) arc.style.strokeDashoffset = String(C * (1 - left/total));
    if(left<=5 && wrap){ wrap.classList.add('warn'); if(lbl) lbl.textContent='서둘러요!'; }
  };
  paint();
  timerHandle = setInterval(()=>{
    left--;
    if(left<=0){
      paint(); stopTimer();
      if(lbl) lbl.textContent='시간 종료!';
      if(typeof onEnd==='function') onEnd();
      return;
    }
    paint();
  }, 1000);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

/* ==================== 캔버스 (그림) ==================== */
let ctx, canvas, drawing=false, penColor='#1A1A1A', penMode='pen', dirty=false, lastX=0, lastY=0;
function canvasBlock(){
  return `
    <canvas id="pad" width="600" height="600"></canvas>
    <div class="tools">
      <button data-tool="pen" class="active">✏️ 펜</button>
      <button data-tool="eraser">지우개</button>
      <button data-tool="clear">전체 지우기</button>
    </div>`;
}
function initCanvas(){
  canvas = document.getElementById('pad');
  ctx = canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineCap='round'; ctx.lineJoin='round';
  dirty=false; penColor='#000000'; penMode='pen';   // 펜은 검정 통일

  document.querySelectorAll('.tools button').forEach(b=>{
    b.onclick=()=>{
      const t=b.dataset.tool;
      if(t==='clear'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); dirty=false; return; }
      setTool(t);
    };
  });

  const pos=(e)=>{
    const r=canvas.getBoundingClientRect();
    const p=e.touches?e.touches[0]:e;
    return {x:(p.clientX-r.left)*(canvas.width/r.width), y:(p.clientY-r.top)*(canvas.height/r.height)};
  };
  const start=(e)=>{ e.preventDefault(); drawing=true; const p=pos(e); lastX=p.x; lastY=p.y; dot(p.x,p.y); };
  const move=(e)=>{ if(!drawing)return; e.preventDefault(); const p=pos(e); stroke(lastX,lastY,p.x,p.y); lastX=p.x; lastY=p.y; };
  const end=()=>{ drawing=false; };
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);
}
function setTool(t){
  penMode=t;
  document.querySelectorAll('.tools button').forEach(b=>{
    if(b.dataset.tool==='pen'||b.dataset.tool==='eraser') b.classList.toggle('active', b.dataset.tool===t);
  });
}
function stroke(x1,y1,x2,y2){
  ctx.strokeStyle = penMode==='eraser'?'#fff':penColor;
  ctx.lineWidth = penMode==='eraser'?36:5;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); dirty=true;
}
function dot(x,y){
  ctx.fillStyle = penMode==='eraser'?'#fff':penColor;
  ctx.beginPath(); ctx.arc(x,y, penMode==='eraser'?18:2.5, 0, Math.PI*2); ctx.fill(); dirty=true;
}
function isCanvasEmpty(){ return !dirty; }
function getCanvasData(){
  // 전송 속도 최우선: 180px + 흑백화. 손그림 선만 남으므로 용량이 매우 작다(대개 <15KB).
  const S=180;
  const tmp=document.createElement('canvas'); tmp.width=S; tmp.height=S;
  const c=tmp.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,S,S);
  c.drawImage(canvas,0,0,S,S);
  // 흑백 변환(용량↓)
  try{
    const im=c.getImageData(0,0,S,S), d=im.data;
    for(let i=0;i<d.length;i+=4){
      const g=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11);
      const v=g<180?0:255;               // 선은 검정, 배경은 흰색으로 이진화
      d[i]=d[i+1]=d[i+2]=v;
    }
    c.putImageData(im,0,0);
  }catch(e){}
  return tmp.toDataURL('image/jpeg',0.5);
}

/* ==================== 유틸 ==================== */
function startPollAgain(step){
  // 데이터가 아직 완전치 않으면 잠시 후 다시 시도
  setTimeout(()=>screenWaitPrev(), 1500);
}
function poll(fn){
  stopPoll();
  const run=async ()=>{ try{ await fn(); }catch(e){ /* 조용히 재시도 */ } };
  run();
  pollTimer=setInterval(run, 3000);
}
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
function showError(msg, retry){
  app.innerHTML = `<div class="card">
    <div class="err">${escapeHtml(msg)}</div>
    <button class="btn btn-navy" id="retry">다시 시도</button>
    <button class="btn btn-ghost mt" id="home">처음으로</button>
  </div>`;
  document.getElementById('retry').onclick = retry;
  document.getElementById('home').onclick = screenStart;
}
function shake(id){ const el=document.getElementById(id); el.style.borderColor='var(--coral)'; el.focus(); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

}
